[package]
name = "echode-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Helper process that runs CLAP plugins outside the DAW"

[dependencies]
clack-host = { workspace = true }
libc = "=0.2.190"
clap-sys = "=0.5.0"
dispatch2 = "=0.3.1"
echode-realtime = { path = "../echode-realtime" }
echode-sandbox = { path = "../echode-sandbox" }
objc2-core-foundation = "=0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2-core-services = { version = "=0.3.2", default-features = false, features = ["std", "FSEvents", "dispatch2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
rtsan-standalone = { version = "=0.3.0", optional = true }

[features]
rtsan = ["dep:rtsan-standalone"]

[dev-dependencies]
echode-actions = { path = "../echode-actions" }
echode-engine = { path = "../echode-engine" }
echode-history = { path = "../echode-history" }
echode-model = { path = "../echode-model" }

[lints]
workspace = true
