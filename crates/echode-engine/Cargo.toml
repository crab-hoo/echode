[package]
name = "echode-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Realtime audio graph, transport, and MIDI playback"

[dependencies]
echode-dsp = { path = "../echode-dsp" }
dasp_interpolate = { version = "=0.11.0", features = ["floor", "linear", "sinc"] }
dasp_ring_buffer = "=0.11.0"
echode-model = { path = "../echode-model" }
echode-realtime = { path = "../echode-realtime" }
echode-sandbox = { path = "../echode-sandbox" }
libc = "=0.2.190"
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware", "HostTime", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
libm = "=0.2.16"
rtrb = "=0.4.0"
rubato = "=5.0.1"
rtsan-standalone = { version = "=0.3.0", optional = true }

[features]
spike = []
rtsan = ["dep:rtsan-standalone"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "echode-engine-spike"
path = "src/bin/spike.rs"
required-features = ["spike"]

[lints]
workspace = true
