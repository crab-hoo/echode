[package]
name = "echode-audio-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Product CoreAudio output and device notifications"

[dependencies]
echode-engine = { path = "../echode-engine" }
echode-history = { path = "../echode-history" }
echode-model = { path = "../echode-model" }
echode-plugin-host = { path = "../echode-plugin-host" }
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware", "HostTime", "objc2-core-audio-types", "block2", "dispatch2", "objc2"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "=0.4.0"
rtsan-standalone = { version = "=0.3.0", optional = true }
block2 = "=0.6.2"
libc = "=0.2.190"

[features]
rtsan = ["echode-engine/rtsan", "dep:rtsan-standalone"]
# A device-free output for tests of the session and the document worker.
headless-output = []

[lints]
workspace = true
