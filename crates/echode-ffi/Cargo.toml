[package]
name = "echode-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "C ABI from the document thread to Swift"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
echode-audio-io = { path = "../echode-audio-io" }
echode-document = { path = "../echode-document" }
echode-draw = { path = "../echode-draw" }
echode-history = { path = "../echode-history" }
echode-log = { path = "../echode-log" }
echode-model = { path = "../echode-model" }
echode-plugin-host = { path = "../echode-plugin-host" }
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

[dev-dependencies]
echode-actions = { path = "../echode-actions" }
echode-audio-io = { path = "../echode-audio-io", features = ["headless-output"] }
libc = "=0.2.190"

[build-dependencies]
cbindgen = "=0.29.4"

[lints]
workspace = true
