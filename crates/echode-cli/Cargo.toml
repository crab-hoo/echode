[package]
name = "echode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Headless Echode commands"

[[bin]]
name = "echode"
path = "src/main.rs"

[dependencies]
echode-api = { path = "../echode-api" }
echode-audio-io = { path = "../echode-audio-io" }
echode-engine = { path = "../echode-engine" }
echode-history = { path = "../echode-history" }
echode-model = { path = "../echode-model" }
echode-plugin-host = { path = "../echode-plugin-host" }

[dev-dependencies]
echode-actions = { path = "../echode-actions" }
serde_json = "1"

[lints]
workspace = true
