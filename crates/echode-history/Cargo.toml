[package]
name = "echode-history"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Plain-text project files with background git history"

[dependencies]
blake3 = "=1.8.7"
echode-actions = { path = "../echode-actions" }
echode-model = { path = "../echode-model" }
flate2 = "1"
gix = { workspace = true }
gix-pack = "=0.65.0"
objc2-audio-toolbox = { version = "=0.3.2", default-features = false, features = ["std", "AudioFile", "ExtendedAudioFile", "objc2-core-audio-types", "objc2-core-foundation"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFURL"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gix = { workspace = true }
libc = "=0.2.190"
insta = "=1.49.0"
proptest = "1.11"

[lints]
workspace = true
