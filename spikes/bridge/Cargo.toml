[package]
name = "echode-bridge-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "UI-2: Swift concurrency and snapshot ownership comparison"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
echode-model = { path = "../../crates/echode-model" }
uniffi = "=0.32.2"
futures-channel = "0.3"
async-trait = "0.1"
cbindgen = { version = "=0.29.4", optional = true }

[features]
bindgen = ["uniffi/cli", "dep:cbindgen"]
async-callback = []
fault-injection = []
sanitizer-control = []

[dev-dependencies]
proptest = "1.11"

[[bin]]
name = "echode-bridge-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[lints]
workspace = true
