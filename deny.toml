# cargo-deny 0.20. `make check` runs `cargo deny check licenses bans sources`;
# `make advisories` runs the advisory check, which needs the network.

[graph]
targets = ["aarch64-apple-darwin"]
# The fuzz binaries' libFuzzer is optional, so name it to check its license too.
features = ["echode-fuzz/libfuzzer"]

[licenses]
# Licenses that a GPL-3.0-or-later program can include (docs/PLAN.md §2.1).
# Not allowed, so not listed: GPL-2.0-only, BSD-4-Clause, EPL, CDDL, and anything without source.
# cargo-deny cannot see an MPL-2.0 file marked "Incompatible With Secondary Licenses";
# check for that notice by hand when adding an MPL-2.0 crate.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    # libFuzzer, through libfuzzer-sys (ADR 0290). The FSF lists it as GPL-compatible.
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
