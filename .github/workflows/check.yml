# Static checks that need no M4 (ADR 0269). GitHub's hosted macOS runners are M1 / M2,
# so the native checks of `make verify` run only on a local M4 and are not recorded here.
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The advisory database changes without any commit.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    if: github.event_name != 'schedule'
    # macOS 27 / Xcode 27: .cargo/config.toml links build scripts for macOS 27.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: ". -> target/portable"
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fetch --locked
      - run: make check-portable

  advisories:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny runs cargo, and rustup refuses the uninstalled pin in rust-toolchain.toml.
      - name: Install the toolchain in rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - run: make advisories
