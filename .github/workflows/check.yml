# Every automatic check is selected from the same policy that agents use.
name: check

on:
  push:
  pull_request:

jobs:
  verification-plan:
    runs-on: macos-15
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python3 scripts/verify.py --github-matrix

  verify:
    needs: verification-plan
    # Apple Silicon, macOS 27 / Xcode 27 (GitHub's current preview label).
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.verification-plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the native M4 and macOS 27 baseline
        run: python3 -B scripts/check_build_host.py
      - name: Install the toolchain in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify-${{ matrix.check }}-nightly-2026-10-09
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fetch --locked
      - if: contains(fromJSON('["check-bridge-asan", "check-bridge-tsan", "check-bridge-miri"]'), matrix.check)
        run: make setup-bridge
      - run: python3 scripts/verify.py --all --only '${{ matrix.check }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ matrix.check }}-logs
          path: |
            target/verification/report.*
            target/verification/*.log
            target/verification/product-contracts.json
            target/verification/product-contracts/**
            target/bridge/address/*.log
            target/bridge/address/*.txt
            target/bridge/address/control/*.log
            target/bridge/thread/*.log
            target/bridge/thread/*.txt
            target/bridge/thread/control/*.log
            target/bridge/miri/*.log
            target/bridge/miri/*.txt

  advisories:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: python3 scripts/verify.py --all --only advisories --run advisories
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-advisories-logs
          path: |
            target/verification/report.*
            target/verification/*.log
