[workspace]
resolver = "3"
members = [
    "crates/echode-sandbox",
    "crates/echode-plugin-host",
    "crates/echode-test-plugin",
    "crates/echode-sine-pad",
    "crates/echode-dsp",
    "crates/echode-time",
    "crates/echode-log",
    "crates/echode-draw",
    "crates/echode-engine",
    "crates/echode-audio-io",
    "crates/echode-realtime",
    "crates/echode-history",
    "crates/echode-model",
    "crates/echode-actions",
    "crates/echode-cli",
    "crates/echode-api",
    "crates/echode-document",
    "crates/echode-ffi",
    "crates/echode-fuzz",
    "spikes/bridge",
]
# Cargo resolves features over the packages a command selects, so every `-p` set
# builds its own copy of the crates. Task-tier builds, tests and the shipped app all
# select these members, sharing one build (ADR 0328). The bridge spike stays out:
# through uniffi it turns on serde_json's unbounded_depth, which the product lacks.
default-members = [
    "crates/echode-sandbox",
    "crates/echode-plugin-host",
    "crates/echode-test-plugin",
    "crates/echode-sine-pad",
    "crates/echode-dsp",
    "crates/echode-time",
    "crates/echode-log",
    "crates/echode-draw",
    "crates/echode-engine",
    "crates/echode-audio-io",
    "crates/echode-realtime",
    "crates/echode-history",
    "crates/echode-model",
    "crates/echode-actions",
    "crates/echode-cli",
    "crates/echode-api",
    "crates/echode-document",
    "crates/echode-ffi",
    "crates/echode-fuzz",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.0.0"
rust-version = "1.96"

[workspace.dependencies]
clack-host = "0.2"
clack-plugin = "0.2"
memmap2 = "0.9"
gix = "0.90"
# The log facade, with structured fields, for every crate that logs (ADR 0322).
log = { version = "=0.4.34", features = ["std", "kv"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block and impl states why it is sound, and `forbid` refuses a
# local allow (ADR 0321). A stale SAFETY comment on safe code is refused too.
undocumented_unsafe_blocks = "forbid"
unnecessary_safety_comment = "warn"

# Full debug info of dependencies made up most of target/debug. Line tables keep
# their file and line in backtraces; workspace crates keep full debug info for lldb.
[profile.dev.package."*"]
debug = "line-tables-only"
